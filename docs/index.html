<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="See your Copperwise gold history outside World of Warcraft. Your file is read in your browser and never uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%99%3C/text%3E%3C/svg%3E">
<title>Copperwise Viewer</title>
<style>
/* Base reset (standalone page) */
:root { color-scheme: light dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Young+Serif&display=swap">
<style>
:root {
  --ground: #f3f4f1;
  --surface: #ffffff;
  --sunk: #e9ebe6;
  --ink: #1d2226;
  --muted: #646b71;
  --line: #d9dcd5;
  --gold: #a87a10;
  --gold-soft: #f1e3bd;
  --brand: #a8552b;
  --brand-soft: #f3e1d5;
  --on-brand: #fff8f2;
  --silver: #8a9096;
  --copper: #b0643a;
  --income: #2c7a57;
  --expense: #b3443a;
  --transfer: #3b6aa3;
  --focus: #a8552b;
  --shadow: 0 1px 2px rgba(29, 34, 38, .06), 0 4px 16px rgba(29, 34, 38, .05);
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #121517;
    --surface: #1a1e21;
    --sunk: #22272b;
    --ink: #e7e4dc;
    --muted: #9aa1a6;
    --line: #2d3337;
    --gold: #e2b54b;
    --gold-soft: #3a3120;
    --brand: #d98a5c;
    --brand-soft: #3a2720;
    --on-brand: #1f130c;
    --silver: #b7bcc0;
    --copper: #d98a5c;
    --income: #62c093;
    --expense: #e67b6e;
    --transfer: #82abdd;
    --focus: #d98a5c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  }
}
:root[data-theme="dark"] {
  --ground: #121517;
  --surface: #1a1e21;
  --sunk: #22272b;
  --ink: #e7e4dc;
  --muted: #9aa1a6;
  --line: #2d3337;
  --gold: #e2b54b;
  --gold-soft: #3a3120;
  --brand: #d98a5c;
  --brand-soft: #3a2720;
  --on-brand: #1f130c;
  --silver: #b7bcc0;
  --copper: #d98a5c;
  --income: #62c093;
  --expense: #e67b6e;
  --transfer: #82abdd;
  --focus: #d98a5c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.5 var(--body);
  padding-inline: 16px;
  padding-block: 0 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
button, select, input { font: inherit; color: inherit; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Header */
header.top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px 20px; padding-block: 22px 4px;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.coin {
  width: 34px; height: 34px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #f2b58c, #b87333 55%, #6e3b17);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25), inset 0 -2px 4px rgba(0, 0, 0, .25);
}
h1 { font: 400 26px/1.1 var(--display); margin: 0; letter-spacing: .01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 14px; cursor: pointer; font-weight: 500;
}
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { filter: brightness(1.06); }

/* Notice / drop */
.notice {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between;
  background: var(--brand-soft); border: 1px dashed var(--brand); border-radius: 10px; padding: 12px 16px;
  font-size: 14px;
}
.notice code { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.notice.loaded { background: var(--surface); border-style: solid; border-color: var(--line); }
.notice .err { color: var(--expense); font-weight: 600; }
body.dragging .notice { outline: 3px solid var(--brand); }

/* Controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button {
  border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer;
  color: var(--muted); font-weight: 500; font-size: 14px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
label.field { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
select, input[type="search"] {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  max-width: 100%;
}

/* Summary */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.stat .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat .value { font-size: 22px; margin-top: 4px; line-height: 1.2; overflow-wrap: anywhere; }
.stat .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.stat.net { border-color: var(--brand); }
.pos { color: var(--income); } .neg { color: var(--expense); } .xfer { color: var(--transfer); }

/* Money */
.money { white-space: nowrap; }
.money i { font-style: normal; font-size: .72em; margin-left: 1px; margin-right: 3px; font-family: var(--body); font-weight: 600; }
.money i.g { color: var(--gold); } .money i.s { color: var(--silver); } .money i.c { color: var(--copper); }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel h2 { font: 400 18px/1.2 var(--display); margin: 0; }
.panel header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.panel header p { margin: 0; color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }

.chart { width: 100%; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font: 11px var(--mono); }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: currentColor; }
.legend .li { color: var(--income); } .legend .le { color: var(--expense); }
.legend span { color: var(--muted); }
.legend .li::before { background: var(--income); } .legend .le::before { background: var(--expense); }

.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 4px 12px; align-items: center; font-size: 14px; }
.bar-row .name { color: var(--ink); }
.bar-track { display: grid; gap: 3px; }
.bar { height: 8px; border-radius: 4px; min-width: 2px; }
.bar.in { background: var(--income); } .bar.out { background: var(--expense); }
.bar-vals { grid-column: 2; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12.5px; }

.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.chip.in { color: var(--income); } .chip.out { color: var(--expense); } .chip.xf { color: var(--transfer); }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 18px 4px; text-align: center; }
.pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 10px; font-size: 14px; color: var(--muted); }
.tx-filters { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.site-footer { max-width: 1120px; margin: 28px auto 0; color: var(--muted); font-size: 13px; }
.site-footer a { color: var(--brand); }

@media (max-width: 820px) {
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 420px) {
  .stat .value { font-size: 18px; }
  .bar-row { grid-template-columns: 78px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .bar { transition: width .35s ease; }
}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="coin" aria-hidden="true"></div>
      <div>
        <h1>Copperwise Viewer</h1>
        <p>Your Copperwise history, outside the game</p>
      </div>
    </div>
    <div class="actions">
      <input type="file" id="file" accept=".lua,.bak,text/plain" hidden>
      <button class="btn primary" id="load">Open Copperwise.lua</button>
      <button class="btn" id="sample" hidden>Show sample</button>
    </div>
  </header>

  <div class="notice" id="notice" role="status"></div>

  <div class="controls">
    <div class="seg" id="periods" role="group" aria-label="Period">
      <button data-p="7" aria-pressed="false">7 days</button>
      <button data-p="30" aria-pressed="true">30 days</button>
      <button data-p="90" aria-pressed="false">90 days</button>
      <button data-p="all" aria-pressed="false">All</button>
    </div>
    <label class="field" for="char">Character
      <select id="char"></select>
    </label>
  </div>

  <section class="summary" id="summary" aria-label="Totals"></section>

  <section class="panel">
    <header>
      <h2>Daily flow</h2>
      <div class="legend"><span class="li">Income</span><span class="le">Expense</span></div>
    </header>
    <div class="chart" id="chart"></div>
  </section>

  <div class="grid2">
    <section class="panel">
      <header><h2>By source</h2><p>Bank transfers excluded</p></header>
      <div class="bars" id="sources"></div>
    </section>
    <section class="panel">
      <header><h2>Auction House</h2><p id="ah-note"></p></header>
      <div class="scroll" id="ah"></div>
    </section>
  </div>

  <section class="panel" id="chars-panel">
    <header><h2>Characters</h2><p>Same period, all characters</p></header>
    <div class="scroll" id="chars"></div>
  </section>

  <section class="panel">
    <header>
      <h2>Transactions</h2>
      <div class="tx-filters">
        <label class="field" for="f-source">Source <select id="f-source"></select></label>
        <label class="field" for="f-type">Type
          <select id="f-type">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
            <option value="transfer">Bank transfer</option>
          </select>
        </label>
        <input type="search" id="f-search" placeholder="Search items" aria-label="Search item names">
      </div>
    </header>
    <div class="scroll" id="tx"></div>
    <div class="pager" id="pager"></div>
  </section>
</div>


<footer class="site-footer">
  <p><a href="https://github.com/NeonRat85/Copperwise">Copperwise on GitHub</a> · <a href="https://www.curseforge.com/wow/addons/copperwise">CurseForge</a> · Your file is read in this browser and never uploaded.</p>
</footer>
<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Lua SavedVariables parser (the subset WoW writes: tables, strings, numbers,
  // booleans, nil, and "-- [n]" comments)
  // ---------------------------------------------------------------------------
  function parseSavedVariables(src) {
    let i = 0;
    const n = src.length;
    const fail = (msg) => { throw new Error(`${msg} (at character ${i})`); };

    function skip() {
      for (;;) {
        while (i < n && /\s/.test(src[i])) i++;
        if (src.startsWith("--", i)) {
          if (src.startsWith("--[[", i)) {
            const end = src.indexOf("]]", i + 4);
            i = end < 0 ? n : end + 2;
          } else {
            while (i < n && src[i] !== "\n") i++;
          }
          continue;
        }
        break;
      }
    }
    function ident() {
      const m = /^[A-Za-z_][A-Za-z0-9_]*/.exec(src.slice(i, i + 200));
      if (!m) fail("Expected a name");
      i += m[0].length;
      return m[0];
    }
    function string() {
      const q = src[i++];
      let out = "";
      while (i < n && src[i] !== q) {
        let ch = src[i++];
        if (ch === "\\") {
          const e = src[i++];
          const map = { n: "\n", t: "\t", r: "\r", "\\": "\\", '"': '"', "'": "'", "\n": "\n", a: "\x07", b: "\b", f: "\f", v: "\v" };
          if (e in map) ch = map[e];
          else if (/[0-9]/.test(e)) {
            let digits = e;
            while (digits.length < 3 && /[0-9]/.test(src[i])) digits += src[i++];
            ch = String.fromCharCode(parseInt(digits, 10));
          } else ch = e;
        }
        out += ch;
      }
      if (src[i] !== q) fail("Unterminated string");
      i++;
      // WoW writes UTF-8 bytes; decimal escapes produce byte chars, so re-decode
      try {
        if (/[\x80-\xff]/.test(out) && !/[^\x00-\xff]/.test(out)) {
          return new TextDecoder().decode(Uint8Array.from(out, (c) => c.charCodeAt(0)));
        }
      } catch (_) { /* keep raw */ }
      return out;
    }
    function number() {
      const m = /^-?(?:0x[0-9a-fA-F]+|(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?|inf|nan)/.exec(src.slice(i, i + 64));
      if (!m) fail("Expected a number");
      i += m[0].length;
      return Number(m[0]);
    }
    function value() {
      skip();
      const c = src[i];
      if (c === "{") return table();
      if (c === '"' || c === "'") return string();
      if (c === "-" || c === "." || /[0-9]/.test(c)) return number();
      const word = ident();
      if (word === "true") return true;
      if (word === "false") return false;
      if (word === "nil") return null;
      fail(`Unexpected "${word}"`);
    }
    function table() {
      i++; // {
      const arr = [];
      const obj = {};
      let isArray = true;
      let index = 1;
      for (;;) {
        skip();
        if (src[i] === "}") { i++; break; }
        let key = null;
        if (src[i] === "[") {
          i++;
          const k = value();
          skip();
          if (src[i] !== "]") fail('Expected "]"');
          i++; skip();
          if (src[i] !== "=") fail('Expected "="');
          i++;
          key = k;
        } else {
          const save = i;
          if (/[A-Za-z_]/.test(src[i])) {
            const word = ident();
            skip();
            if (src[i] === "=" && src[i + 1] !== "=") { i++; key = word; }
            else i = save;
          }
        }
        const v = value();
        if (key === null) { obj[index] = v; arr.push(v); index++; }
        else {
          obj[key] = v;
          if (!(typeof key === "number" && key === arr.length + 1)) isArray = false;
          else arr.push(v);
        }
        skip();
        if (src[i] === "," || src[i] === ";") i++;
      }
      return isArray && arr.length === Object.keys(obj).length ? arr : obj;
    }

    const globals = {};
    for (;;) {
      skip();
      if (i >= n) break;
      const name = ident();
      skip();
      if (src[i] !== "=") fail('Expected "="');
      i++;
      globals[name] = value();
    }
    return globals;
  }

  // ---------------------------------------------------------------------------
  // Formatting
  // ---------------------------------------------------------------------------
  const SOURCES = {
    vendor: "Vendor", repair: "Repair", ah: "Auction House", mail: "Mail", quest: "Quest",
    loot: "Loot", trade: "Trade", bank: "Bank", guildbank: "Guild Bank", unknown: "Other",
  };
  const DAY = 86400;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const groupFmt = new Intl.NumberFormat(undefined);

  function money(copper, { sign = false, short = false } = {}) {
    const neg = copper < 0;
    const abs = Math.abs(Math.round(copper));
    const g = Math.floor(abs / 10000), s = Math.floor(abs / 100) % 100, c = abs % 100;
    // Short: whole gold with separators (millions abbreviated); full: g s c, dropping trailing zeros
    let body;
    if (short && g >= 1e7) {
      body = `${(g / 1e6).toFixed(1)}M&#8201;<i class="g">g</i>`;
    } else if (short && g > 0) {
      body = `${groupFmt.format(g)}<i class="g">g</i>`;
    } else if (g > 0) {
      body = `${groupFmt.format(g)}<i class="g">g</i>` +
        (s || c ? `${s}<i class="s">s</i>` : "") + (c ? `${c}<i class="c">c</i>` : "");
    } else if (s > 0) {
      body = `${s}<i class="s">s</i>` + (short || !c ? "" : `${c}<i class="c">c</i>`);
    } else {
      body = `${c}<i class="c">c</i>`;
    }
    const prefix = neg ? "−" : sign && copper > 0 ? "+" : "";
    return `<span class="money num">${prefix}${body}</span>`;
  }
  const plainGold = (copper) => {
    const g = Math.abs(copper) / 10000;
    return (copper < 0 ? "−" : "") + (g >= 1000 ? groupFmt.format(Math.round(g)) : g >= 1 ? g.toFixed(0) : g.toFixed(2)) + "g";
  };
  const dayKey = (ts) => {
    const d = new Date(ts * 1000);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  };
  const startOfDay = (ts) => { const d = new Date(ts * 1000); d.setHours(0, 0, 0, 0); return d.getTime() / 1000; };
  const dateTimeFmt = new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  const shortDateFmt = new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short" });

  // ---------------------------------------------------------------------------
  // Sample data (shown until a real file is opened)
  // ---------------------------------------------------------------------------
  function sampleDB() {
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const now = Math.floor(Date.now() / 1000);
    const items = ["Iron Ore", "Dream Shard", "Linen Cloth", "Flask of Power", "Corroded Plate Greatbelt", "Mooncloth", "Phial of Tenacity"];
    const make = (scale) => {
      const entries = [];
      for (let d = 45; d >= 0; d--) {
        const base = now - d * DAY - 3600 * 6;
        const count = 2 + Math.floor(rnd() * 6);
        for (let k = 0; k < count; k++) {
          const ts = base + Math.floor(rnd() * 10 * 3600);
          const r = rnd();
          if (r < .28) {
            const gross = Math.floor((20 + rnd() * 900) * 10000 * scale);
            const cut = Math.floor(gross * .05);
            entries.push({ timestamp: ts, type: "income", source: "ah", amount: gross - cut, grossAmount: gross, cutAmount: cut, ahType: "sale", itemName: items[Math.floor(rnd() * items.length)] });
          } else if (r < .45) entries.push({ timestamp: ts, type: "income", source: "loot", amount: Math.floor((1 + rnd() * 40) * 10000 * scale) });
          else if (r < .55) entries.push({ timestamp: ts, type: "income", source: "quest", amount: Math.floor((10 + rnd() * 60) * 10000 * scale) });
          else if (r < .68) {
            const qty = 1 + Math.floor(rnd() * 20);
            const name = ["Frostweave Cloth", "Broken Fang", "Torn Pelt", "Iron Ore"][Math.floor(rnd() * 4)];
            entries.push({ timestamp: ts, type: "income", source: "vendor", amount: Math.floor((2 + rnd() * 80) * 10000 * scale), vendorType: "sale", itemName: qty > 1 ? `${name} (${qty})` : name, quantity: qty });
          }
          else if (r < .78) entries.push({ timestamp: ts, type: "expense", source: "repair", amount: Math.floor((5 + rnd() * 70) * 10000) });
          else if (r < .88) entries.push({ timestamp: ts, type: "expense", source: "ah", amount: Math.floor((30 + rnd() * 600) * 10000), ahType: "purchase", itemName: items[Math.floor(rnd() * items.length)] });
          else if (r < .94) entries.push({ timestamp: ts, type: "expense", source: "vendor", amount: Math.floor((1 + rnd() * 50) * 10000) });
          else entries.push({ timestamp: ts, type: "transfer", source: "bank", direction: rnd() < .7 ? "deposit" : "withdraw", amount: Math.floor((100 + rnd() * 2000) * 10000) });
        }
      }
      entries.sort((a, b) => a.timestamp - b.timestamp);
      return { entries };
    };
    return {
      characters: { "Example-Silvermoon": make(1), "Sample-Stormrage": make(.4) },
      warbandBank: { amount: 1834250075, updated: now - 3600 },
    };
  }

  // ---------------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------------
  const STORE_KEY = "copperwise-viewer:lastFile";
  const OLD_STORE_KEY = "goldledger-viewer:lastFile";
  const state = { db: null, sample: true, fileName: "", loadedAt: 0, period: "30", char: "__all", page: 1, source: "all", type: "all", search: "" };
  const $ = (id) => document.getElementById(id);

  function store(get, value) {
    try {
      if (get) return JSON.parse(localStorage.getItem(STORE_KEY) || localStorage.getItem(OLD_STORE_KEY) || "null");
      localStorage.setItem(STORE_KEY, JSON.stringify(value));
    } catch (_) { return null; }
  }

  function loadText(text, fileName, persist) {
    const globals = parseSavedVariables(text);
    // Copperwise, or GoldLedger from before the rename
    const db = globals.CopperwiseDB || globals.GoldLedgerDB;
    if (!db || typeof db !== "object" || !db.characters) {
      throw new Error("This file doesn't contain Copperwise data. Pick Copperwise.lua (or an older GoldLedger.lua) from your SavedVariables folder.");
    }
    state.db = db;
    state.sample = false;
    state.fileName = fileName;
    state.loadedAt = Date.now();
    state.char = "__all";
    state.page = 1;
    if (persist) store(false, { text, fileName, loadedAt: state.loadedAt });
    render();
  }

  function showError(err) {
    $("notice").className = "notice";
    $("notice").innerHTML = `<span><span class="err">Couldn't read that file.</span> ${esc(err.message)}</span>`;
  }

  // ---------------------------------------------------------------------------
  // Derived data
  // ---------------------------------------------------------------------------
  const entriesOf = (charData) => {
    const e = charData && charData.entries;
    if (Array.isArray(e)) return e;
    return e ? Object.values(e) : [];
  };

  function periodBounds() {
    const now = Date.now() / 1000;
    const end = startOfDay(now) + DAY;
    if (state.period === "all") {
      let min = end - DAY;
      for (const cd of Object.values(state.db.characters)) {
        for (const e of entriesOf(cd)) if (e.timestamp < min) min = e.timestamp;
      }
      return { start: startOfDay(min), end };
    }
    const days = Number(state.period);
    return { start: end - days * DAY, end };
  }

  function selectedEntries(bounds, charName = state.char) {
    const out = [];
    for (const [name, cd] of Object.entries(state.db.characters)) {
      if (charName !== "__all" && name !== charName) continue;
      for (const e of entriesOf(cd)) {
        if (typeof e.timestamp !== "number") continue;
        if (e.timestamp >= bounds.start && e.timestamp < bounds.end) out.push({ ...e, char: name });
      }
    }
    return out.sort((a, b) => b.timestamp - a.timestamp);
  }

  function totals(entries) {
    const t = { income: 0, expense: 0, deposit: 0, withdraw: 0, count: 0 };
    for (const e of entries) {
      if (e.type === "income") t.income += e.amount || 0;
      else if (e.type === "expense") t.expense += e.amount || 0;
      else if (e.type === "transfer") t[e.direction === "withdraw" ? "withdraw" : "deposit"] += e.amount || 0;
      t.count++;
    }
    return t;
  }

  // ---------------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------------
  function renderNotice() {
    const el = $("notice");
    if (state.sample) {
      el.className = "notice";
      el.innerHTML = `<span><strong>Showing sample data.</strong> Open <code>Copperwise.lua</code> from <code>World of Warcraft\\_retail_\\WTF\\Account\\&lt;account&gt;\\SavedVariables\\</code>, or drop it on this page. It's read in your browser and never uploaded.</span>`;
      $("sample").hidden = true;
      return;
    }
    const chars = Object.keys(state.db.characters).length;
    const when = state.loadedAt ? new Date(state.loadedAt).toLocaleString() : "";
    el.className = "notice loaded";
    el.innerHTML = `<span><strong>${esc(state.fileName || "Copperwise.lua")}</strong> · ${chars} character${chars === 1 ? "" : "s"} · opened ${esc(when)}</span><span class="muted">The game writes this file when you log out or /reload. Reopen it to refresh.</span>`;
    $("sample").hidden = false;
  }

  function renderCharSelect() {
    const sel = $("char");
    const names = Object.keys(state.db.characters).sort();
    sel.innerHTML = `<option value="__all">All characters</option>` + names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
    if (state.char !== "__all" && !names.includes(state.char)) state.char = "__all";
    sel.value = state.char;
  }

  function renderSummary(entries, bounds) {
    const t = totals(entries);
    const net = t.income - t.expense;
    const days = Math.max(1, Math.round((bounds.end - bounds.start) / DAY));
    const wb = state.db.warbandBank;
    const wbSub = wb && wb.updated ? `as of ${shortDateFmt.format(new Date(wb.updated * 1000))}` : "Visit a bank in game to record it";
    $("summary").innerHTML = `
      <div class="stat"><div class="label">Income</div><div class="value pos">${money(t.income, { short: true })}</div><div class="sub">${money(t.income)}</div></div>
      <div class="stat"><div class="label">Expense</div><div class="value neg">${money(t.expense, { short: true })}</div><div class="sub">${money(t.expense)}</div></div>
      <div class="stat net"><div class="label">Net</div><div class="value ${net >= 0 ? "pos" : "neg"}">${money(net, { sign: true, short: true })}</div><div class="sub">${money(Math.round(net / days), { sign: true, short: true })} per day</div></div>
      <div class="stat"><div class="label">Warband bank</div><div class="value xfer">${money(wb ? wb.amount || 0 : 0, { short: true })}</div><div class="sub">${wbSub}</div></div>`;
    $("summary").title = `Bank transfers this period: ${t.deposit ? plainGold(t.deposit) + " deposited" : "none deposited"}, ${t.withdraw ? plainGold(t.withdraw) + " withdrawn" : "none withdrawn"}`;
  }

  function niceMax(v) {
    if (v <= 0) return 10000;
    const g = v / 10000;
    const p = Math.pow(10, Math.floor(Math.log10(g)));
    const m = [1, 2, 2.5, 5, 10].find((x) => x * p >= g);
    return m * p * 10000;
  }

  function renderChart(entries, bounds) {
    const box = $("chart");
    const days = [];
    for (let t = bounds.start; t < bounds.end; t += DAY) days.push({ key: dayKey(t + 3600), ts: t, income: 0, expense: 0 });
    const idx = new Map(days.map((d, k) => [d.key, k]));
    for (const e of entries) {
      const k = idx.get(dayKey(e.timestamp));
      if (k === undefined) continue;
      if (e.type === "income") days[k].income += e.amount || 0;
      else if (e.type === "expense") days[k].expense += e.amount || 0;
    }
    const W = Math.max(300, Math.round(box.clientWidth || 700));
    const H = W < 500 ? 220 : 260;
    const padL = 64, padR = 8, padT = 10, padB = 24;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const top = niceMax(Math.max(...days.map((d) => d.income), 0));
    const bottom = niceMax(Math.max(...days.map((d) => d.expense), 0));
    const scale = plotH / (top + bottom);
    const zeroY = padT + top * scale;
    const slot = plotW / days.length;
    const bw = Math.max(1, Math.min(22, slot * .7));
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily income and expense">`;
    // grid + labels at top, zero, bottom
    const ticks = [[padT, top], [zeroY, 0], [padT + plotH, -bottom]];
    for (const [y, v] of ticks) {
      svg += `<line x1="${padL}" x2="${W - padR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"${v === 0 ? "" : ' stroke-dasharray="3 4"'}/>`;
      svg += `<text x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end">${esc(v === 0 ? "0" : plainGold(v))}</text>`;
    }
    const labelEvery = Math.ceil(days.length / (W < 500 ? 4 : 7));
    days.forEach((d, k) => {
      const x = padL + k * slot + (slot - bw) / 2;
      const hi = d.income * scale, he = d.expense * scale;
      const tip = `${shortDateFmt.format(new Date(d.ts * 1000))}: +${plainGold(d.income)} / −${plainGold(d.expense)}`;
      svg += `<g><title>${esc(tip)}</title>`;
      svg += `<rect x="${x.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${plotH}" fill="transparent"/>`;
      if (hi > 0) svg += `<rect x="${x.toFixed(1)}" y="${(zeroY - hi).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, hi).toFixed(1)}" rx="1.5" fill="var(--income)"/>`;
      if (he > 0) svg += `<rect x="${x.toFixed(1)}" y="${zeroY.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, he).toFixed(1)}" rx="1.5" fill="var(--expense)"/>`;
      svg += `</g>`;
      if (k % labelEvery === 0 || k === days.length - 1) {
        if (k === days.length - 1 && k % labelEvery !== 0 && (k % labelEvery) < labelEvery * .6) return;
        svg += `<text x="${(padL + k * slot + slot / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(shortDateFmt.format(new Date(d.ts * 1000)))}</text>`;
      }
    });
    svg += `</svg>`;
    box.innerHTML = svg;
  }

  function renderSources(entries) {
    const by = {};
    for (const e of entries) {
      if (e.type !== "income" && e.type !== "expense") continue;
      const s = SOURCES[e.source] ? e.source : "unknown";
      by[s] = by[s] || { income: 0, expense: 0 };
      by[s][e.type] += e.amount || 0;
    }
    const rows = Object.entries(by).sort((a, b) => (b[1].income + b[1].expense) - (a[1].income + a[1].expense));
    if (!rows.length) { $("sources").innerHTML = `<div class="empty">No income or expenses in this period.</div>`; return; }
    const max = Math.max(...rows.map(([, v]) => Math.max(v.income, v.expense)));
    $("sources").innerHTML = rows.map(([s, v]) => `
      <div class="bar-row">
        <div class="name">${esc(SOURCES[s])}</div>
        <div class="bar-track">
          ${v.income ? `<div class="bar in" style="width:${(v.income / max * 100).toFixed(2)}%"></div>` : ""}
          ${v.expense ? `<div class="bar out" style="width:${(v.expense / max * 100).toFixed(2)}%"></div>` : ""}
        </div>
        <div class="bar-vals">${v.income ? `<span class="pos">${money(v.income, { sign: true, short: true })}</span>` : ""}${v.expense ? `<span class="neg">${money(-v.expense, { short: true })}</span>` : ""}</div>
      </div>`).join("");
  }

  function renderAH(entries) {
    const sales = {};
    let cut = 0, buys = 0, deposits = 0;
    for (const e of entries) {
      if (e.source !== "ah") continue;
      if (e.ahType === "sale") {
        const name = (e.itemName || "Unknown item").replace(/\s*\(\d+\)$/, "");
        const row = sales[name] = sales[name] || { count: 0, net: 0 };
        row.count++; row.net += e.amount || 0; cut += e.cutAmount || 0;
      } else if (e.ahType === "purchase") buys += e.amount || 0;
      else if (e.ahType === "deposit") deposits += e.amount || 0;
    }
    const rows = Object.entries(sales).sort((a, b) => b[1].net - a[1].net).slice(0, 8);
    $("ah-note").innerHTML = cut ? `AH cut paid: ${money(cut, { short: true })}` : "";
    if (!rows.length) {
      $("ah").innerHTML = `<div class="empty">No auction sales with item details in this period.</div>`;
      return;
    }
    $("ah").innerHTML = `<table>
      <thead><tr><th>Top sellers</th><th class="r">Sales</th><th class="r">Net</th></tr></thead>
      <tbody>${rows.map(([name, r]) => `<tr><td>${esc(name)}</td><td class="r num">${r.count}</td><td class="r pos">${money(r.net, { short: true })}</td></tr>`).join("")}</tbody>
      </table>
      <p class="muted" style="margin:10px 0 0;font-size:13px">Bought ${money(buys, { short: true })} · listing deposits ${money(deposits, { short: true })}</p>`;
  }

  function renderChars(bounds) {
    const names = Object.keys(state.db.characters);
    $("chars-panel").hidden = names.length < 2;
    if (names.length < 2) return;
    const rows = names.map((name) => {
      const t = totals(selectedEntries(bounds, name));
      return { name, ...t, net: t.income - t.expense };
    }).sort((a, b) => b.net - a.net);
    $("chars").innerHTML = `<table>
      <thead><tr><th>Character</th><th class="r">Income</th><th class="r">Expense</th><th class="r">Net</th><th class="r">Transactions</th></tr></thead>
      <tbody>${rows.map((r) => `<tr>
        <td><button class="btn" style="padding:2px 10px" data-char="${esc(r.name)}">${esc(r.name)}</button></td>
        <td class="r pos">${money(r.income, { short: true })}</td>
        <td class="r neg">${money(r.expense, { short: true })}</td>
        <td class="r ${r.net >= 0 ? "pos" : "neg"}">${money(r.net, { sign: true, short: true })}</td>
        <td class="r num">${r.count}</td></tr>`).join("")}</tbody></table>`;
  }

  const PER_PAGE = 25;
  function renderTransactions(entries) {
    const srcSel = $("f-source");
    const present = [...new Set(entries.map((e) => (SOURCES[e.source] ? e.source : "unknown")))];
    srcSel.innerHTML = `<option value="all">All</option>` + Object.keys(SOURCES).filter((s) => present.includes(s)).map((s) => `<option value="${s}">${SOURCES[s]}</option>`).join("");
    if (state.source !== "all" && !present.includes(state.source)) state.source = "all";
    srcSel.value = state.source;
    $("f-type").value = state.type;

    const q = state.search.trim().toLowerCase();
    const list = entries.filter((e) =>
      (state.source === "all" || (SOURCES[e.source] ? e.source : "unknown") === state.source) &&
      (state.type === "all" || e.type === state.type) &&
      (!q || (e.itemName || "").toLowerCase().includes(q)));
    const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
    state.page = Math.min(state.page, pages);
    const slice = list.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);
    const showChar = state.char === "__all" && Object.keys(state.db.characters).length > 1;

    if (!slice.length) {
      $("tx").innerHTML = `<div class="empty">No transactions match these filters.</div>`;
      $("pager").innerHTML = "";
      return;
    }
    $("tx").innerHTML = `<table>
      <thead><tr><th>When</th>${showChar ? "<th>Character</th>" : ""}<th>Source</th><th>Details</th><th class="r">Amount</th></tr></thead>
      <tbody>${slice.map((e) => {
        let chip, amount;
        if (e.type === "transfer") {
          const out = e.direction !== "withdraw";
          chip = `<span class="chip xf">${out ? "Deposit" : "Withdrawal"}</span>`;
          amount = `<span class="xfer">${money(out ? -(e.amount || 0) : e.amount || 0, { sign: true })}</span>`;
        } else {
          const inc = e.type === "income";
          chip = `<span class="chip ${inc ? "in" : "out"}">${esc(SOURCES[e.source] || "Other")}</span>`;
          amount = `<span class="${inc ? "pos" : "neg"}">${money(inc ? e.amount || 0 : -(e.amount || 0), { sign: true })}</span>`;
        }
        const details = [];
        if (e.ahType) details.push(e.ahType === "sale" ? "Sold" : e.ahType === "purchase" ? "Bought" : "Listing deposit");
        if (e.vendorType === "sale") details.push("Sold");
        const items = Array.isArray(e.items) ? e.items : e.items ? Object.values(e.items) : null;
        if (items && items.length > 1) {
          details.push(items.map((it) => esc(it.quantity > 1 ? `${it.name} (${it.quantity})` : it.name)).join(", "));
        } else if (e.itemName) details.push(esc(e.itemName));
        if (e.cutAmount) details.push(`<span class="muted">cut ${money(e.cutAmount)}</span>`);
        if (e.type === "transfer") details.push("Warband bank");
        return `<tr><td class="num muted" style="white-space:nowrap">${esc(dateTimeFmt.format(new Date(e.timestamp * 1000)))}</td>${showChar ? `<td>${esc(e.char.split("-")[0])}</td>` : ""}<td>${chip}</td><td>${details.join(" · ") || '<span class="muted">—</span>'}</td><td class="r">${amount}</td></tr>`;
      }).join("")}</tbody></table>`;
    $("pager").innerHTML = pages > 1
      ? `<span class="num">${(state.page - 1) * PER_PAGE + 1}–${Math.min(state.page * PER_PAGE, list.length)} of ${list.length}</span>
         <button class="btn" data-page="-1" ${state.page === 1 ? "disabled" : ""}>Previous</button>
         <button class="btn" data-page="1" ${state.page === pages ? "disabled" : ""}>Next</button>`
      : `<span class="num">${list.length} transaction${list.length === 1 ? "" : "s"}</span>`;
  }

  function render() {
    renderNotice();
    renderCharSelect();
    document.querySelectorAll("#periods button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.p === state.period)));
    const bounds = periodBounds();
    const entries = selectedEntries(bounds);
    renderSummary(entries, bounds);
    renderChart(entries, bounds);
    renderSources(entries);
    renderAH(entries);
    renderChars(bounds);
    renderTransactions(entries);
  }

  // ---------------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------------
  function readFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { loadText(String(reader.result), file.name, true); }
      catch (err) { showError(err); }
    };
    reader.onerror = () => showError(new Error("The browser couldn't read the file."));
    reader.readAsText(file);
  }

  $("load").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", (e) => { readFile(e.target.files[0]); e.target.value = ""; });
  $("sample").addEventListener("click", () => {
    state.db = sampleDB(); state.sample = true; state.char = "__all"; state.page = 1;
    try { localStorage.removeItem(STORE_KEY); } catch (_) {}
    render();
  });
  $("periods").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-p]");
    if (!b) return;
    state.period = b.dataset.p; state.page = 1; render();
  });
  $("char").addEventListener("change", (e) => { state.char = e.target.value; state.page = 1; render(); });
  $("chars").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-char]");
    if (!b) return;
    state.char = b.dataset.char; state.page = 1; render();
    $("char").focus();
  });
  $("f-source").addEventListener("change", (e) => { state.source = e.target.value; state.page = 1; render(); });
  $("f-type").addEventListener("change", (e) => { state.type = e.target.value; state.page = 1; render(); });
  $("f-search").addEventListener("input", (e) => { state.search = e.target.value; state.page = 1; render(); });
  $("pager").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-page]");
    if (!b) return;
    state.page += Number(b.dataset.page); render();
  });

  let dragDepth = 0;
  window.addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
  window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
    readFile(e.dataTransfer && e.dataTransfer.files[0]);
  });

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (state.db) renderChart(selectedEntries(periodBounds()), periodBounds()); }, 120);
  });

  // Boot: last opened file if this browser remembers one, otherwise sample data
  const saved = store(true);
  if (saved && saved.text) {
    try { loadText(saved.text, saved.fileName, false); state.loadedAt = saved.loadedAt; renderNotice(); return; }
    catch (_) { /* fall through to sample */ }
  }
  state.db = sampleDB();
  render();
})();
</script>
</body>
</html>
